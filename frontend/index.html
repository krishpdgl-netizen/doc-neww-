<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DiffIQ — Document Difference Engine</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#11243a;--line:#223952;--text:#edf5ff;--muted:#91a7bd;--accent:#66a6ff;--add:#163c2c;--addt:#75e2a5;--del:#442128;--delt:#ff9ba7;--mod:#3d3217;--modt:#ffd77a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101d,#0a1728);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{min-height:100vh}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#081525eF;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:12px;margin-left:10px}.main{max-width:1450px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:32px;margin:0 0 7px}.hero p{color:var(--muted);margin:0}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 15px;border-radius:9px;cursor:pointer}.btn.primary{background:#2e6ed1;border-color:#4c91f0}.btn:disabled{opacity:.45;cursor:not-allowed}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:16px}.drop{border:1px dashed #3b5874;border-radius:14px;background:var(--panel);padding:22px;min-height:145px;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--accent);background:#10253d}.drop input{display:none}.drop h3{margin:0 0 8px}.file{margin-top:18px;padding:11px;border:1px solid var(--line);background:#091626;border-radius:9px;display:flex;justify-content:space-between}.status{margin:16px 0;color:var(--muted);min-height:20px}.dashboard{display:none}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px}.metric b{display:block;font-size:23px;margin-bottom:4px}.metric span{color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:300px 1fr;gap:14px}.changes,.viewer{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.changes-head,.viewer-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.change-list{max-height:650px;overflow:auto}.change{padding:12px 14px;border-bottom:1px solid #1b3046;cursor:pointer}.change:hover{background:#102238}.badge{font-size:10px;border-radius:20px;padding:3px 7px;font-weight:700;text-transform:uppercase}.badge.add{background:var(--add);color:var(--addt)}.badge.rem{background:var(--del);color:var(--delt)}.badge.mod{background:var(--mod);color:var(--modt)}.badge.same{background:#1d2a38;color:#9fb2c7}.change-text{margin-top:7px;color:#c6d3e0;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sides{display:grid;grid-template-columns:1fr 1fr;min-height:550px}.side{border-right:1px solid var(--line)}.side:last-child{border-right:0}.side-title{padding:10px 14px;background:#0a1727;color:var(--muted);font-size:12px;position:sticky;top:0}.block{padding:10px 14px;border-bottom:1px solid #172a3f;line-height:1.5;white-space:pre-wrap}.block.add{background:var(--add)}.block.rem{background:var(--del)}.block.mod{background:var(--mod)}.block.same{color:#b9c7d5}.word.rem{background:#73313b;color:#ffd9de;text-decoration:line-through}.word.add{background:#226044;color:#d9ffe9}.word.mod{background:#725b19;color:#fff0bd}.empty{padding:50px;text-align:center;color:var(--muted)}.notice{background:#0e2237;border:1px solid #244766;padding:12px;border-radius:9px;color:#a9c2da;margin-top:12px}.spinner{display:inline-block;width:13px;height:13px;border:2px solid #526b84;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;margin-right:7px}@keyframes r{to{transform:rotate(360deg)}}@media(max-width:900px){.uploads,.workspace,.sides{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.hero{display:block}.actions{margin-top:15px}.side{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><span class="brand">Diff<span>IQ</span></span><span class="sub">Structural document comparison engine</span></div><div><button class="btn" id="newBtn">New comparison</button></div></header>
<main class="main">
<section class="hero"><div><h1>Find every meaningful difference.</h1><p>Compare revisions with structural, word-level and document-aware analysis.</p></div><div class="actions"><button class="btn" id="reportBtn" disabled>Download JSON report</button><button class="btn primary" id="compareBtn" disabled>Compare documents</button></div></section>
<section class="uploads">
<label class="drop" id="leftDrop"><input id="leftInput" type="file" accept=".pdf,.docx,.xlsx,.xlsm,.pptx,.txt,.md,.csv"><h3>Original document</h3><div>Drop a file here or click to browse</div><div class="sub">PDF · Word · Excel · PowerPoint · TXT · CSV</div><div class="file" id="leftFile">No file selected</div></label>
<label class="drop" id="rightDrop"><input id="rightInput" type="file" accept=".pdf,.docx,.xlsx,.xlsm,.pptx,.txt,.md,.csv"><h3>Revised document</h3><div>Drop a file here or click to browse</div><div class="sub">Use the same format for structural comparison</div><div class="file" id="rightFile">No file selected</div></label>
</section>
<div class="status" id="status"></div>
<div class="dashboard" id="dashboard">
<div class="metrics"><div class="metric"><b id="mSimilarity">—</b><span>Similarity</span></div><div class="metric"><b id="mModified">0</b><span>Modified</span></div><div class="metric"><b id="mAdded">0</b><span>Added</span></div><div class="metric"><b id="mRemoved">0</b><span>Removed</span></div><div class="metric"><b id="mSame">0</b><span>Unchanged</span></div></div>
<div class="workspace"><aside class="changes"><div class="changes-head"><b>Changes</b><span id="changeCount"></span></div><div class="change-list" id="changeList"></div></aside><section class="viewer"><div class="viewer-head"><b>Document comparison</b><span id="formatInfo"></span></div><div class="sides"><div class="side"><div class="side-title" id="leftTitle">Original</div><div id="leftView"></div></div><div class="side"><div class="side-title" id="rightTitle">Revised</div><div id="rightView"></div></div></div></section></div>
</div>
</main></div>
<script>
(function(){
var API=window.DIFFIQ_API||'https://diffiq-api.onrender.com';
var leftFile=null,rightFile=null,lastResult=null;
var $=function(id){return document.getElementById(id)};
function setStatus(msg,loading){$('status').innerHTML=loading?'<span class="spinner"></span>'+msg:msg;}
function bindDrop(drop,input,side){
 drop.addEventListener('dragover',function(e){e.preventDefault();drop.classList.add('drag')});
 drop.addEventListener('dragleave',function(){drop.classList.remove('drag')});
 drop.addEventListener('drop',function(e){e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0]) choose(e.dataTransfer.files[0],side)});
 input.addEventListener('change',function(){if(input.files[0]) choose(input.files[0],side)});
}
function choose(file,side){
 var allowed=['pdf','docx','xlsx','xlsm','pptx','txt','md','csv'];var e=file.name.toLowerCase().split('.').pop();
 if(allowed.indexOf(e)<0){setStatus('Unsupported file type: '+e);return}
 if(side==='left'){leftFile=file;$('leftFile').textContent=file.name}else{rightFile=file;$('rightFile').textContent=file.name}
 $('compareBtn').disabled=!(leftFile&&rightFile);
 if(leftFile&&rightFile){var a=leftFile.name.split('.').pop().toLowerCase(),b=rightFile.name.split('.').pop().toLowerCase();if(a!==b)setStatus('Use the same file format for structural comparison.')} }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function renderTokens(tokens){return tokens.map(function(t){if(t.type==='same')return esc(t.right||t.left);if(t.type==='added')return '<span class="word add">'+esc(t.right)+'</span> ';if(t.type==='removed')return '<span class="word rem">'+esc(t.left)+'</span> ';return '<span class="word mod">'+esc(t.left)+' → '+esc(t.right)+'</span> '}).join('')}
function blockText(change,side){var b=side==='left'?change.left:change.right;if(!b)return '<div class="empty">—</div>';if(change.type==='modified'&&change.tokens)return '<div class="block mod">'+renderTokens(change.tokens)+'</div>';return '<div class="block '+change.type+'">'+esc(b.text)+'</div>'}
function renderResult(r){
 lastResult=r;$('dashboard').style.display='block';$('mSimilarity').textContent=r.similarity+'%';$('mModified').textContent=r.summary.modified;$('mAdded').textContent=r.summary.added;$('mRemoved').textContent=r.summary.removed;$('mSame').textContent=r.summary.same;$('changeCount').textContent=r.changes.length;$('formatInfo').textContent=(r.left.format||'').toUpperCase();$('leftTitle').textContent=r.files.left;$('rightTitle').textContent=r.files.right;
 var cl=$('changeList'),lv=$('leftView'),rv=$('rightView');cl.innerHTML='';lv.innerHTML='';rv.innerHTML='';
 r.changes.forEach(function(c,i){var d=document.createElement('div');d.className='change';var label=c.type==='removed'?'Removed':c.type==='added'?'Added':c.type==='modified'?'Modified':'Same';var cls=c.type==='removed'?'rem':c.type==='added'?'add':c.type==='modified'?'mod':'same';var b=c.left||c.right;d.innerHTML='<span class="badge '+cls+'">'+label+'</span><div class="change-text">'+esc(b?b.text:'')+'</div>';d.onclick=function(){var x=document.getElementById('chg-'+i);if(x)x.scrollIntoView({behavior:'smooth',block:'center'})};cl.appendChild(d);
 var ld=document.createElement('div');ld.id='chg-'+i;ld.innerHTML=blockText(c,'left');lv.appendChild(ld);var rd=document.createElement('div');rd.innerHTML=blockText(c,'right');rv.appendChild(rd);
 });
 if(!r.changes.length){lv.innerHTML='<div class="empty">No content differences found.</div>';rv.innerHTML='<div class="empty">No content differences found.</div>'}
}
$('compareBtn').addEventListener('click',async function(){
 if(!leftFile||!rightFile)return;var le=leftFile.name.toLowerCase().split('.').pop(),re=rightFile.name.toLowerCase().split('.').pop();if(le!==re){setStatus('Both files must have the same format.');return}
 var fd=new FormData();fd.append('left',leftFile);fd.append('right',rightFile);$('compareBtn').disabled=true;setStatus('Uploading and comparing documents…',true);
 try{var res=await fetch(API+'/compare',{method:'POST',body:fd});var data=await res.json();if(!res.ok)throw new Error(data.detail||'Server returned '+res.status);renderResult(data);setStatus('Comparison complete. '+data.changes.length+' blocks analysed.')}catch(e){setStatus('Comparison failed: '+e.message);$('dashboard').style.display='none'}finally{$('compareBtn').disabled=false}
});
$('reportBtn').addEventListener('click',function(){if(!lastResult)return;var blob=new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='diffiq-report.json';a.click();URL.revokeObjectURL(a.href)});
$('newBtn').addEventListener('click',function(){location.reload()});
bindDrop($('leftDrop'),$('leftInput'),'left');bindDrop($('rightDrop'),$('rightInput'),'right');
})();
</script>
</body></html>
